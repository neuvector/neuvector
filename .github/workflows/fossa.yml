name: FOSSA Scanning
on:
  push:
    branches: ["main", "master", "release/**"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  fossa-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The FOSSA token is shared between all repos in NeuVector's GH org. It can
      # be used directly and there is no need to request specific access to EIO.
      - name: Read FOSSA token
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89
        with:
          secrets: |
            secret/data/github/org/neuvector/fossa/credentials token | FOSSA_API_KEY_PUSH_ONLY
      - name: FOSSA scan
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ env.FOSSA_API_KEY_PUSH_ONLY }}
          # Only runs the scan and do not provide/returns any results back to the
          # pipeline.
          run-tests: false
