  - name: Automatically merge Renovate PRs (main)
    conditions:
      - base=main
      - check-success=E2E test
      - check-success=unitest
      - check-success=golangci-lint
      - check-success=openapi-lint
      - author=renovate-rancher[bot]
      - -conflict
    actions:
      merge:
        method: rebase

