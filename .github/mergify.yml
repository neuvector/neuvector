pull_request_rules:
  - name: Automatically open v5.6 backport PR
    conditions:
      - base=main
      - label="pr-backport-to/v5.6"
    actions:
      backport:
        branches:
          - release/v5.6
        assignees:
          - "{{ author }}"

  - name: Automatically open v5.5 backport PR
    conditions:
      - base=main
      - label="pr-backport-to/v5.5"
    actions:
      backport:
        branches:
          - release/v5.5
        assignees:
          - "{{ author }}"

  - name: Automatically open v5.4 backport PR
    conditions:
      - base=main
      - label="pr-backport-to/v5.4"
    actions:
      backport:
        branches:
          - release/v5.4
        assignees:
